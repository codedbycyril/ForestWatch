<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f2">
  <meta name="description" content="ForestWatch connects community reports and satellite insights to help protect Kenya's forests.">
  <title>ForestWatch – {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/css/site.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <header class="site-header">
    <nav class="navigation" aria-label="Main navigation">
      <div class="brand-group">
        <a class="ranger-shortcut" href="{% if session.get('ranger_authenticated') %}/dashboard{% else %}/ranger/login{% endif %}"
           aria-label="{% if session.get('ranger_authenticated') %}Open ranger dashboard{% else %}Ranger sign in{% endif %}"
           title="{% if session.get('ranger_authenticated') %}Ranger dashboard{% else %}Ranger sign in{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 21a8 8 0 1 0-16 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a class="brand" href="/" aria-label="ForestWatch home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M16 3 6 14h5L5 21h8v8h6v-8h8l-6-7h5L16 3Z" fill="currentColor"/><path d="M13 21h6" stroke="#E8F0E2" stroke-width="1.5"/></svg>
          </span>
          <span>Forest<span class="brand-light">Watch</span></span>
        </a>
      </div>
      <div class="nav-links">
        <a href="/" class="{% if request.path == '/' %}is-active{% endif %}">Overview</a>
        <a href="/report" class="{% if request.path == '/report' %}is-active{% endif %}">Report an incident</a>
        <a href="/architecture" class="{% if request.path == '/architecture' %}is-active{% endif %}">How it works</a>
        <a href="/lab" class="{% if request.path == '/lab' %}is-active{% endif %}">Satellite Lab</a>
      </div>
    </nav>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="footer-brand" href="/">ForestWatch</a>
      <span>Community intelligence for healthier forests.</span>
      <span class="footer-credit">Group 23 · IST1020</span>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
